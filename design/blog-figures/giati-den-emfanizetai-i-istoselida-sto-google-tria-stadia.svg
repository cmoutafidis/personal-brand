<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560">
  <rect width="720" height="560" fill="#fff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="24" y="24" width="672" height="112" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="72" font-size="30" font-weight="700" fill="#0f172a">1. Ανίχνευση</text>
  <text x="48" y="110" font-size="24" fill="#0f172a">σε βρίσκει;</text>
  <line x1="356" y1="44" x2="356" y2="116" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="72" font-size="24" font-weight="600" fill="#0f172a">Έλεγχος: site:</text>
  <text x="380" y="110" font-size="24" fill="#475569">ξεχασμένο noindex;</text>

  <line x1="360" y1="136" x2="360" y2="172" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="24" y="176" width="672" height="112" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="224" font-size="30" font-weight="700" fill="#0f172a">2. Ευρετηρίαση</text>
  <text x="48" y="262" font-size="24" fill="#0f172a">την κρατάει;</text>
  <line x1="356" y1="196" x2="356" y2="268" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="224" font-size="24" font-weight="600" fill="#b45309">Καμία εγγύηση</text>
  <text x="380" y="262" font-size="24" fill="#475569">έχει δικό της λόγο;</text>

  <line x1="360" y1="288" x2="360" y2="324" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="24" y="328" width="672" height="112" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="376" font-size="30" font-weight="700" fill="#0f172a">3. Προβολή</text>
  <text x="48" y="414" font-size="24" fill="#0f172a">τη δείχνει;</text>
  <line x1="356" y1="348" x2="356" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="376" font-size="24" font-weight="600" fill="#0f172a">Ο τίτλος της σελίδας</text>
  <text x="380" y="414" font-size="24" fill="#475569">ένα θέμα, ένας τίτλος</text>

  <line x1="360" y1="440" x2="360" y2="472" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="160" y="476" width="400" height="60" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="360" y="515" font-size="26" font-weight="700" fill="#15803d" text-anchor="middle">Αποτέλεσμα αναζήτησης</text>
</svg>
