<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548">
  <rect width="720" height="548" fill="#fff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- start of the process -->
  <rect x="130" y="20" width="460" height="92" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="360" y="58" text-anchor="middle" font-size="24" fill="#0f172a">Παραγγελία, παραστατικό<tspan x="360" dy="1.2em">ή αίτηση πελάτη</tspan></text>
  <line x1="360" y1="112" x2="360" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <!-- ERP stays -->
  <rect x="130" y="144" width="460" height="96" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="360" y="184" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">ERP ή λογιστικό</text>
  <text x="360" y="220" text-anchor="middle" font-size="24" font-weight="600" fill="#15803d">μένει όπως το ξέρεις</text>
  <line x1="290" y1="240" x2="200" y2="280" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="430" y1="240" x2="520" y2="280" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <!-- before -->
  <rect x="24" y="284" width="320" height="128" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="184" y="322" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">Πριν</text>
  <text x="184" y="358" text-anchor="middle" font-size="24" fill="#0f172a">κάποιος αντιγράφει<tspan x="184" dy="1.2em">στοιχεία με το χέρι</tspan></text>
  <!-- after -->
  <rect x="376" y="284" width="320" height="128" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="536" y="322" text-anchor="middle" font-size="26" font-weight="700" fill="#0086ff">Τώρα</text>
  <text x="536" y="358" text-anchor="middle" font-size="24" fill="#0f172a">η αυτοματοποίηση<tspan x="536" dy="1.2em">το κάνει μόνη της</tspan></text>
  <line x1="200" y1="412" x2="290" y2="448" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="520" y1="412" x2="430" y2="448" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <!-- end -->
  <rect x="130" y="452" width="460" height="76" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="360" y="499" text-anchor="middle" font-size="24" fill="#0f172a">Email, excel ή καρτέλα</text>
</svg>
