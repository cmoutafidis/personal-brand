<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540">
  <rect width="720" height="540" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- top strip: the visit -->
  <rect x="24" y="24" width="200" height="96" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="124" y="64" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Αναζήτηση<tspan x="124" dy="1.2em">στην Google</tspan></text>

  <rect x="260" y="24" width="200" height="96" rx="14" fill="#0086ff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Κλικ</text>

  <rect x="496" y="24" width="200" height="96" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="596" y="64" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Η ιστοσελίδα<tspan x="596" dy="1.2em">σου</tspan></text>

  <line x1="226" y1="72" x2="256" y2="72" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="462" y1="72" x2="492" y2="72" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <line x1="124" y1="122" x2="124" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="596" y1="122" x2="596" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- Search Console -->
  <rect x="24" y="166" width="324" height="350" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="210" font-size="28" font-weight="700" fill="#0f172a">Search Console</text>
  <text x="48" y="246" font-size="24" font-weight="600" fill="#0086ff">πριν από το κλικ</text>
  <text x="48" y="292" font-size="24" fill="#0f172a">• πόσες εμφανίσεις<tspan x="48" dy="1.25em">• σε ποια ερωτήματα</tspan><tspan x="48" dy="1.25em">• πόσοι πάτησαν</tspan></text>
  <line x1="48" y1="390" x2="324" y2="390" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="428" font-size="24" fill="#475569">Απαντά στο:</text>
  <text x="48" y="464" font-size="24" font-weight="700" fill="#0f172a">«Γιατί δεν έρχεται<tspan x="48" dy="1.2em">κόσμος;»</tspan></text>

  <!-- Google Analytics -->
  <rect x="372" y="166" width="324" height="350" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="396" y="210" font-size="28" font-weight="700" fill="#0f172a">Google Analytics</text>
  <text x="396" y="246" font-size="24" font-weight="600" fill="#475569">μετά το κλικ</text>
  <text x="396" y="292" font-size="24" fill="#0f172a">• ποιες σελίδες βλέπουν<tspan x="396" dy="1.25em">• πόσο μένουν</tspan><tspan x="396" dy="1.25em">• τι κάνουν</tspan></text>
  <line x1="396" y1="390" x2="672" y2="390" stroke="#cbd5e1" stroke-width="2"/>
  <text x="396" y="428" font-size="24" fill="#475569">Απαντά στο:</text>
  <text x="396" y="464" font-size="24" font-weight="700" fill="#0f172a">«Γιατί έρχεται κόσμος<tspan x="396" dy="1.2em">και δεν αγοράζει;»</tspan></text>
</svg>
