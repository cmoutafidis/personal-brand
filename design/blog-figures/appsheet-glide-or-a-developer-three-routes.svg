<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556">
  <rect width="720" height="556" fill="#fff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- question -->
  <rect x="20" y="16" width="680" height="96" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Who should build your app?</text>
  <text x="360" y="92" text-anchor="middle" font-size="24" fill="#475569">Three realistic ways, pick the one that fits</text>
  <!-- trunk -->
  <line x1="52" y1="112" x2="52" y2="476" stroke="#334155" stroke-width="3"/>
  <line x1="52" y1="204" x2="78" y2="204" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="52" y1="340" x2="78" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="52" y1="476" x2="78" y2="476" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <!-- row 1 -->
  <rect x="82" y="146" width="340" height="116" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="186" font-size="24" fill="#0f172a">Someone in-house will<tspan x="104" dy="1.2em">build and run it, and</tspan><tspan x="104" dy="1.2em">the app is simple</tspan></text>
  <line x1="422" y1="204" x2="456" y2="204" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="460" y="146" width="240" height="116" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="580" y="196" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">No-code tool</text>
  <text x="580" y="230" text-anchor="middle" font-size="24" fill="#475569">AppSheet, Glide</text>
  <!-- row 2 -->
  <rect x="82" y="282" width="340" height="116" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="322" font-size="24" fill="#0f172a">You can brief it tightly<tspan x="104" dy="1.2em">and want to run the</tspan><tspan x="104" dy="1.2em">build yourself</tspan></text>
  <line x1="422" y1="340" x2="456" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="460" y="282" width="240" height="116" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="580" y="332" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Freelance<tspan x="580" dy="1.2em">developer</tspan></text>
  <!-- row 3 -->
  <rect x="82" y="418" width="340" height="116" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="458" font-size="24" fill="#0f172a">You want it built for<tspan x="104" dy="1.2em">you, at a set price,</tspan><tspan x="104" dy="1.2em">tried before you pay</tspan></text>
  <line x1="422" y1="476" x2="456" y2="476" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="460" y="418" width="240" height="116" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="580" y="468" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">A service that<tspan x="580" dy="1.2em">builds it</tspan></text>
</svg>
