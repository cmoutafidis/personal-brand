<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 940">
  <rect width="720" height="940" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- question -->
  <rect x="180" y="20" width="360" height="64" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="360" y="61" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Ερώτηση του χρήστη</text>
  <line x1="360" y1="84" x2="360" y2="110" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <!-- rewrite -->
  <rect x="80" y="112" width="560" height="96" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="150" text-anchor="middle" font-size="24" fill="#0f172a"><tspan font-weight="700">Το ChatGPT</tspan> την ξαναγράφει<tspan x="360" dy="1.2em">σε νέα υποερωτήματα σε κάθε απάντηση</tspan></text>
  <line x1="360" y1="208" x2="360" y2="234" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <!-- sub-queries panel -->
  <rect x="20" y="236" width="680" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="36" y="252" width="206" height="64" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="139" y="293" text-anchor="middle" font-size="24" fill="#0f172a">Υποερώτημα 1</text>
  <rect x="257" y="252" width="206" height="64" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="293" text-anchor="middle" font-size="24" fill="#0f172a">Υποερώτημα 2</text>
  <rect x="478" y="252" width="206" height="64" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="581" y="293" text-anchor="middle" font-size="24" fill="#0f172a">Υποερώτημα 3</text>
  <text x="360" y="360" text-anchor="middle" font-size="24" fill="#475569">σπάνια ίδια με της Google ή του Bing</text>
  <line x1="360" y1="386" x2="360" y2="412" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <!-- own search -->
  <rect x="80" y="414" width="560" height="96" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="452" text-anchor="middle" font-size="24" fill="#0f172a">Η δική του αναζήτηση<tspan x="360" dy="1.2em">φέρνει σελίδες</tspan></text>
  <line x1="360" y1="510" x2="360" y2="536" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <!-- cites -->
  <rect x="80" y="538" width="560" height="96" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="576" text-anchor="middle" font-size="24" fill="#0f172a"><tspan font-weight="700">Αναφέρει μόνο αυτές</tspan><tspan x="360" dy="1.2em" font-weight="700">τις σελίδες</tspan></text>
  <!-- variance split -->
  <text x="360" y="688" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Τι εξηγεί τη διαφορά ανάμεσα<tspan x="360" dy="1.2em">σε σελίδες του ίδιου ιστότοπου</tspan></text>
  <rect x="20" y="744" width="330" height="130" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="185" y="794" text-anchor="middle" font-size="36" font-weight="700" fill="#0086ff">32%</text>
  <text x="185" y="828" text-anchor="middle" font-size="24" fill="#0f172a">ποιες σελίδες φέρνει<tspan x="185" dy="1.2em">η αναζήτηση</tspan></text>
  <rect x="370" y="744" width="330" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="535" y="794" text-anchor="middle" font-size="36" font-weight="700" fill="#475569">2,8%</text>
  <text x="535" y="828" text-anchor="middle" font-size="24" fill="#0f172a">οι ιδιότητες<tspan x="535" dy="1.2em">της ίδιας της σελίδας</tspan></text>
  <text x="360" y="914" text-anchor="middle" font-size="24" fill="#475569">Μερίδια διακύμανσης, όχι επισκεψιμότητα</text>
</svg>
