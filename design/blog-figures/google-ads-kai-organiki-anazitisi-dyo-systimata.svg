<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560">
  <rect width="720" height="560" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- one search -->
  <rect x="160" y="20" width="400" height="72" rx="14" fill="#fff" stroke="#334155" stroke-width="3"/>
  <text x="360" y="66" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Ίδια αναζήτηση</text>

  <path d="M240 92 L180 136" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M480 92 L540 136" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- ads -->
  <rect x="24" y="140" width="312" height="244" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="184" font-size="30" font-weight="700" fill="#0f172a">Διαφήμιση</text>
  <text x="48" y="226" font-size="24" fill="#0f172a">Δημοπρασία σε κάθε<tspan x="48" dy="1.2em">αναζήτηση</tspan></text>
  <text x="48" y="296" font-size="24" fill="#0f172a">Πληρώνεις μόνο όταν<tspan x="48" dy="1.2em">αλληλεπιδρά κάποιος</tspan></text>
  <text x="48" y="366" font-size="24" font-weight="600" fill="#0086ff">Έχει διακόπτη</text>

  <!-- organic -->
  <rect x="384" y="140" width="312" height="244" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="408" y="184" font-size="30" font-weight="700" fill="#0f172a">Οργανικό</text>
  <text x="408" y="226" font-size="24" fill="#0f172a">Δωρεάν καταχώριση,<tspan x="408" dy="1.2em">επειδή είναι συναφής</tspan></text>
  <text x="408" y="296" font-size="24" fill="#0f172a">Η θέση δεν<tspan x="408" dy="1.2em">αγοράζεται</tspan></text>
  <text x="408" y="366" font-size="24" font-weight="600" fill="#475569">Χωρίς διακόπτη</text>

  <!-- wall between them -->
  <line x1="360" y1="150" x2="360" y2="374" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="360" cy="262" r="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <path d="M352 254 L368 270 M368 254 L352 270" stroke="#b91c1c" stroke-width="3"/>

  <!-- the point -->
  <rect x="24" y="408" width="672" height="132" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="360" y="448" font-size="28" font-weight="700" fill="#b91c1c" text-anchor="middle">Δύο συστήματα που δεν επικοινωνούν</text>
  <text x="360" y="486" font-size="24" fill="#0f172a" text-anchor="middle">Η διαφήμιση δεν ανεβάζει την οργανική θέση.</text>
  <text x="360" y="520" font-size="24" fill="#0f172a" text-anchor="middle">Η διακοπή της δεν τη ρίχνει.</text>
</svg>
