<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544">
  <rect width="720" height="544" fill="#fff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- top: the problem -->
  <rect x="70" y="20" width="580" height="72" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="360" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Your key person goes on holiday</text>

  <!-- split arrows -->
  <path d="M360 92 V112 H180 V136" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M360 112 H540 V136" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>

  <!-- left column: unwritten -->
  <rect x="20" y="140" width="320" height="92" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="180" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">Steps live only<tspan x="180" dy="1.2em">in their head</tspan></text>
  <path d="M180 232 V264" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="20" y="268" width="320" height="124" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="180" y="310" text-anchor="middle" font-size="24" font-weight="400" fill="#0f172a">Every unwritten step<tspan x="180" dy="1.2em">becomes a question</tspan><tspan x="180" dy="1.2em">with no one to ask</tspan></text>
  <path d="M180 392 V424" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="20" y="428" width="320" height="92" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="180" y="468" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">Work stalls, a piece<tspan x="180" dy="1.2em">at a time</tspan></text>

  <!-- right column: written and running -->
  <rect x="380" y="140" width="320" height="92" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="540" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#15803d">Steps written down<tspan x="540" dy="1.2em">anyone can follow</tspan></text>
  <path d="M540 232 V264" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="380" y="268" width="320" height="124" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="540" y="310" text-anchor="middle" font-size="24" font-weight="400" fill="#0f172a">Stable, structured<tspan x="540" dy="1.2em">processes run</tspan><tspan x="540" dy="1.2em">by themselves</tspan></text>
  <path d="M540 392 V424" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="380" y="428" width="320" height="92" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="540" y="468" text-anchor="middle" font-size="26" font-weight="700" fill="#15803d">The company<tspan x="540" dy="1.2em">carries on</tspan></text>
</svg>
