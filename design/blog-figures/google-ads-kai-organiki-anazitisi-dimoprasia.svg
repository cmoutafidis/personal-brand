<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840">
  <rect width="720" height="840" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- every search -->
  <rect x="24" y="20" width="416" height="80" rx="14" fill="#fff" stroke="#334155" stroke-width="3"/>
  <text x="48" y="58" font-size="28" font-weight="700" fill="#0f172a">Κάθε αναζήτηση</text>
  <text x="48" y="88" font-size="24" fill="#475569">η δημοπρασία τρέχει ξανά</text>

  <line x1="232" y1="100" x2="232" y2="136" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- ad rank -->
  <rect x="24" y="140" width="672" height="168" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="182" font-size="28" font-weight="700" fill="#0f172a">Κατάταξη διαφήμισης (Ad Rank)</text>
  <text x="48" y="222" font-size="24" fill="#0f172a">Προσφορά, ποιότητα διαφήμισης και σελίδας<tspan x="48" dy="1.25em">προορισμού, ελάχιστα όρια, ανταγωνισμός,</tspan><tspan x="48" dy="1.25em">περιβάλλον αναζήτησης, στοιχεία διαφήμισης</tspan></text>

  <line x1="232" y1="308" x2="232" y2="344" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- first calculation -->
  <rect x="24" y="348" width="416" height="104" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="388" font-size="26" font-weight="700" fill="#0f172a">1ος υπολογισμός</text>
  <text x="48" y="426" font-size="24" fill="#0f172a">Περνά τα ελάχιστα όρια;</text>

  <!-- no branch -->
  <line x1="440" y1="400" x2="500" y2="400" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="470" y="386" font-size="24" font-weight="600" fill="#b91c1c" text-anchor="middle">Όχι</text>
  <rect x="504" y="348" width="192" height="104" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="600" y="390" font-size="24" font-weight="700" fill="#b91c1c" text-anchor="middle">Δεν</text>
  <text x="600" y="424" font-size="24" font-weight="700" fill="#b91c1c" text-anchor="middle">εμφανίζεται</text>

  <line x1="232" y1="452" x2="232" y2="500" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="248" y="484" font-size="24" font-weight="600" fill="#15803d">Ναι</text>

  <!-- second calculation -->
  <rect x="24" y="504" width="416" height="104" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="48" y="544" font-size="26" font-weight="700" fill="#0f172a">2ος υπολογισμός</text>
  <text x="48" y="582" font-size="24" fill="#0f172a">Θέση ανάμεσα στις επιλέξιμες</text>

  <line x1="232" y1="608" x2="232" y2="644" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- what you pay -->
  <rect x="24" y="648" width="672" height="172" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="48" y="690" font-size="28" font-weight="700" fill="#15803d">Πληρώνεις μόνο στην αλληλεπίδραση</text>
  <text x="48" y="730" font-size="24" fill="#0f172a">Το ελάχιστο για να περάσεις τα όρια και να<tspan x="48" dy="1.25em">ξεπεράσεις αυτόν ακριβώς από κάτω σου:</tspan><tspan x="48" dy="1.25em">συχνά λιγότερο από τη μέγιστη προσφορά</tspan></text>
</svg>
