<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556">
  <rect width="720" height="556" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- one name -->
  <rect x="100" y="20" width="520" height="104" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="62" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">«Προώθηση ιστοσελίδων»</text>
  <text x="360" y="102" font-size="24" fill="#475569" text-anchor="middle">ένα όνομα, τέσσερις δουλειές</text>

  <line x1="360" y1="124" x2="360" y2="158" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- the day you stop paying -->
  <rect x="24" y="162" width="672" height="60" rx="14" fill="#fff" stroke="#334155" stroke-width="3"/>
  <text x="360" y="201" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Η μέρα που σταματάς να πληρώνεις</text>

  <line x1="192" y1="222" x2="192" y2="256" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="528" y1="222" x2="528" y2="256" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- stops -->
  <rect x="24" y="260" width="336" height="168" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="48" y="302" font-size="30" font-weight="700" fill="#b91c1c">Σταματά</text>
  <text x="48" y="342" font-size="24" fill="#0f172a">Οι πληρωμένες<tspan x="48" dy="1.25em">επισκέψεις, μαζί με</tspan><tspan x="48" dy="1.25em">τη δαπάνη</tspan></text>

  <!-- stays -->
  <rect x="376" y="260" width="320" height="168" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="400" y="302" font-size="30" font-weight="700" fill="#15803d">Μένει</text>
  <text x="400" y="342" font-size="24" fill="#0f172a">Οι σελίδες, τα κείμενα<tspan x="400" dy="1.25em">και το ιστορικό</tspan><tspan x="400" dy="1.25em">των μετρήσεων</tspan></text>

  <line x1="536" y1="428" x2="536" y2="456" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- condition -->
  <rect x="24" y="460" width="672" height="76" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="360" y="507" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Μόνο αν οι λογαριασμοί είναι στο δικό σου όνομα</text>
</svg>
