  </defs>
  <rect x="40" y="24" width="290" height="96" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="185" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Η ιστοσελίδα σου</text>
  <text x="185" y="100" text-anchor="middle" font-size="24" fill="#475569">σαρώνεται</text>
  <rect x="390" y="24" width="290" height="96" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="535" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Άλλες πηγές</text>
