  <path d="M185,120 L292,180" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M535,120 L428,180" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="222" y="166" text-anchor="end" font-size="26" font-weight="700" fill="#0086ff">ταΐζει</text>
  <rect x="150" y="184" width="420" height="80" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="234" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Επιχειρηματικό προφίλ</text>
  <path d="M360,264 L360,320" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <rect x="110" y="324" width="500" height="100" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="366" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Τοπικά αποτελέσματα</text>
  <text x="360" y="402" text-anchor="middle" font-size="24" fill="#475569">στους Χάρτες και στην Αναζήτηση</text>
  <text x="360" y="464" text-anchor="middle" font-size="24" fill="#475569">κρίνονται κυρίως με</text>
