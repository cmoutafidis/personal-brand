  <text x="360" y="517" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Απόσταση</text>
  <rect x="490" y="480" width="200" height="56" rx="14" fill="#edfaff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="590" y="517" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Δημοτικότητα</text>
