<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556">
  <rect width="720" height="556" fill="#fff"/>
  <!-- column headers -->
  <rect x="20" y="20" width="330" height="96" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="185" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">Τεκμηριωμένο</text>
  <text x="185" y="96" text-anchor="middle" font-size="24" fill="#0f172a">γραμμένο και μετρήσιμο</text>
  <rect x="370" y="20" width="330" height="96" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="535" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">Μάρκετινγκ</text>
  <text x="535" y="96" text-anchor="middle" font-size="24" fill="#0f172a">κανείς δεν το υπόσχεται</text>
  <!-- left items -->
  <rect x="20" y="134" width="330" height="92" rx="14" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="185" y="172" text-anchor="middle" font-size="24" fill="#0f172a">Ποιοι crawlers περνούν<tspan x="185" dy="1.2em">και με ποιο όνομα</tspan></text>
  <rect x="20" y="240" width="330" height="92" rx="14" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="185" y="278" text-anchor="middle" font-size="24" fill="#0f172a">Ποιον διακόπτη κλείνει<tspan x="185" dy="1.2em">ποιο αρχείο</tspan></text>
  <rect x="20" y="346" width="330" height="92" rx="14" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="185" y="384" text-anchor="middle" font-size="24" fill="#0f172a">Τι μετρούν Search Console<tspan x="185" dy="1.2em">και Bing Webmaster Tools</tspan></text>
  <!-- right items -->
  <rect x="370" y="134" width="330" height="92" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="535" y="172" text-anchor="middle" font-size="24" fill="#0f172a">«Θα σε αναφέρει<tspan x="535" dy="1.2em">το ChatGPT»</tspan></text>
  <rect x="370" y="240" width="330" height="92" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="535" y="278" text-anchor="middle" font-size="24" fill="#0f172a">«Θα εμποδίσουμε τα AI<tspan x="535" dy="1.2em">να διαβάσουν τη σελίδα»</tspan></text>
  <rect x="370" y="346" width="330" height="92" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="535" y="384" text-anchor="middle" font-size="24" fill="#0f172a">«Ειδοποιούμε αμέσως<tspan x="535" dy="1.2em">όλες τις μηχανές»</tspan></text>
  <!-- bottom quote -->
  <rect x="20" y="458" width="680" height="78" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="506" text-anchor="middle" font-size="24" fill="#0f172a"><tspan font-weight="700">Google:</tspan> «Indexing and serving isn't guaranteed.»</text>
</svg>
