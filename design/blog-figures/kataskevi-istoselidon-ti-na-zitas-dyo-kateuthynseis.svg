<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544">
  <rect width="720" height="544" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- the written agreement -->
  <rect x="24" y="24" width="672" height="124" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="64" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Γραπτά, πριν ξεκινήσει η δουλειά</text>
  <text x="360" y="100" font-size="24" fill="#15803d" font-weight="600" text-anchor="middle">Στην αρχή: κοστίζει μηδέν να συμφωνηθεί</text>
  <text x="360" y="132" font-size="24" fill="#b91c1c" font-weight="600" text-anchor="middle">Μετά: κοστίζει πολλά να διορθωθεί</text>

  <!-- arrows up into the agreement: the list works both ways -->
  <line x1="190" y1="196" x2="190" y2="154" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="530" y1="196" x2="530" y2="154" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- you ask -->
  <rect x="24" y="200" width="332" height="320" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="190" y="238" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Ζητάς εσύ</text>
  <line x1="48" y1="254" x2="332" y2="254" stroke="#cbd5e1" stroke-width="2"/>
  <text font-size="24" fill="#0f172a">
    <tspan x="48" y="290">Domain στο όνομά σου</tspan>
    <tspan x="48" y="328">Πρόσβαση διαχειριστή</tspan>
    <tspan x="48" y="366">Γραπτό αντικείμενο</tspan>
    <tspan x="48" y="404">Ημερομηνία και</tspan>
    <tspan x="48" y="434">κανόνας παύσης</tspan>
    <tspan x="48" y="472">Τι παραδίδεται</tspan>
  </text>

  <!-- builder asks -->
  <rect x="364" y="200" width="332" height="320" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="530" y="238" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Ζητά ο κατασκευαστής</text>
  <line x1="388" y1="254" x2="672" y2="254" stroke="#cbd5e1" stroke-width="2"/>
  <text font-size="24" fill="#0f172a">
    <tspan x="388" y="290">Έναν άνθρωπο</tspan>
    <tspan x="388" y="320">που αποφασίζει</tspan>
    <tspan x="388" y="358">Το υλικό σου</tspan>
    <tspan x="388" y="396">Απαντήσεις σε</tspan>
    <tspan x="388" y="426">λογικό χρόνο</tspan>
    <tspan x="388" y="464">Μια εναρκτήρια</tspan>
    <tspan x="388" y="494">συνάντηση</tspan>
  </text>
</svg>
