<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556">
  <rect width="720" height="556" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- the owner's question -->
  <text x="360" y="52" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">What will our app cost?</text>

  <!-- the build -->
  <rect x="24" y="84" width="352" height="320" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="200" y="126" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">The build</text>
  <text x="200" y="160" font-size="24" fill="#475569" text-anchor="middle">sized by scope</text>
  <line x1="48" y1="180" x2="352" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <text x="48" y="220" font-size="24" fill="#0f172a">Screens and roles</text>
  <text x="48" y="258" font-size="24" fill="#0f172a">Jobs it covers</text>
  <text x="48" y="296" font-size="24" fill="#0f172a">What it connects to</text>
  <text x="48" y="334" font-size="24" fill="#0f172a">Your real data moving in</text>
  <text x="48" y="372" font-size="24" fill="#0f172a">Logins and permissions</text>

  <!-- plus -->
  <text x="404" y="256" font-size="40" font-weight="700" fill="#334155" text-anchor="middle">+</text>

  <!-- running cost -->
  <rect x="432" y="84" width="264" height="320" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="564" y="126" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Running cost</text>
  <text x="564" y="160" font-size="24" fill="#475569" text-anchor="middle">month after month</text>
  <line x1="456" y1="180" x2="672" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <text x="456" y="220" font-size="24" fill="#0f172a">Hosting</text>
  <text x="456" y="258" font-size="24" fill="#0f172a">Backups</text>
  <text x="456" y="296" font-size="24" fill="#0f172a">Security updates</text>
  <text x="456" y="334" font-size="24" fill="#0f172a">The odd change</text>

  <!-- arrows to the quote -->
  <line x1="200" y1="404" x2="200" y2="438" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="564" y1="404" x2="564" y2="438" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- the quote -->
  <rect x="24" y="442" width="672" height="90" rx="14" fill="#fff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="480" font-size="24" font-weight="600" fill="#0f172a" text-anchor="middle">A good quote comes after someone has looked</text>
  <text x="360" y="512" font-size="24" font-weight="600" fill="#0f172a" text-anchor="middle">at your columns and heard how your team works</text>
</svg>
