<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560">
  <rect width="720" height="560" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="24" y="20" width="672" height="100" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Οδηγία (ΕΕ) 2019/882 και ν. 4994/2022</text>
  <text x="360" y="98" text-anchor="middle" font-size="24" fill="#475569">υπηρεσίες μετά τις 28 Ιουνίου 2025</text>

  <line x1="234" y1="120" x2="234" y2="156" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="24" y="160" width="420" height="100" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="44" y="201" font-size="24" font-weight="600" fill="#0f172a">Είναι «υπηρεσία<tspan x="44" dy="1.3em">ηλεκτρονικού εμπορίου»;</tspan></text>
  <line x1="444" y1="210" x2="488" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="492" y="160" width="204" height="100" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="594" y="201" text-anchor="middle" font-size="24" fill="#b45309">Ρώτα<tspan x="594" dy="1.3em" font-weight="700">τον δικηγόρο</tspan></text>

  <line x1="234" y1="260" x2="234" y2="296" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="24" y="300" width="420" height="100" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="44" y="341" font-size="24" font-weight="600" fill="#0f172a">Ισχύει η απαλλαγή των<tspan x="44" dy="1.3em">πολύ μικρών επιχειρήσεων;</tspan></text>
  <line x1="444" y1="350" x2="488" y2="350" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="492" y="300" width="204" height="100" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="594" y="341" text-anchor="middle" font-size="24" fill="#b45309">Ρώτα<tspan x="594" dy="1.3em" font-weight="700">τον λογιστή</tspan></text>

  <line x1="234" y1="400" x2="234" y2="436" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="24" y="440" width="420" height="100" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="44" y="481" font-size="24" font-weight="600" fill="#0f172a">Τι αλλάζει στον κώδικα:<tspan x="44" dy="1.3em" font-weight="400">alt, label, lang, focus</tspan></text>
  <line x1="444" y1="490" x2="488" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="492" y="440" width="204" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="594" y="481" text-anchor="middle" font-size="24" fill="#15803d">Αλλάζει<tspan x="594" dy="1.3em" font-weight="700">HTML και CSS</tspan></text>
