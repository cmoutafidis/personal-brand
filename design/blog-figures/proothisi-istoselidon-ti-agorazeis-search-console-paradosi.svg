<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 688">
  <rect width="720" height="688" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="100" y="20" width="520" height="104" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="62" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Τέλος συνεργασίας</text>
  <text x="360" y="100" font-size="24" fill="#475569" text-anchor="middle">ο πάροχος ήταν ιδιοκτήτης</text>

  <line x1="184" y1="124" x2="184" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="536" y1="124" x2="536" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- wrong way -->
  <rect x="24" y="164" width="320" height="128" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="48" y="206" font-size="28" font-weight="700" fill="#b91c1c">Λάθος</text>
  <text x="48" y="246" font-size="24" fill="#0f172a">Μόνο διαγράφεις<tspan x="48" dy="1.25em">τον πάροχο</tspan></text>

  <!-- right way, step 1 -->
  <rect x="376" y="164" width="320" height="128" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="400" y="206" font-size="28" font-weight="700" fill="#15803d">Σωστά: 1</text>
  <text x="400" y="246" font-size="24" fill="#0f172a">Επαληθεύεσαι<tspan x="400" dy="1.25em">πρώτα εσύ</tspan></text>

  <line x1="184" y1="292" x2="184" y2="328" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <line x1="536" y1="292" x2="536" y2="328" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- wrong way, result -->
  <rect x="24" y="332" width="320" height="168" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="48" y="374" font-size="28" font-weight="700" fill="#b91c1c">Το token μένει</text>
  <text x="48" y="414" font-size="24" fill="#0f172a">Ο πάροχος μπορεί να<tspan x="48" dy="1.25em">ξανα-επαληθευτεί</tspan><tspan x="48" dy="1.25em">μόνος του</tspan></text>

  <!-- right way, step 2 -->
  <rect x="376" y="332" width="320" height="168" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="400" y="374" font-size="28" font-weight="700" fill="#15803d">Σωστά: 2</text>
  <text x="400" y="414" font-size="24" fill="#0f172a">Βγάζεις το token του,<tspan x="400" dy="1.25em">π.χ. την ετικέτα HTML</tspan></text>

  <line x1="536" y1="500" x2="536" y2="536" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- caution -->
  <rect x="24" y="540" width="672" height="128" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="48" y="582" font-size="28" font-weight="700" fill="#b45309">Προσοχή πριν σβήσεις</text>
  <text x="48" y="622" font-size="24" fill="#0f172a">Το ίδιο token μπορεί να το χρησιμοποιούν<tspan x="48" dy="1.25em">και άλλες υπηρεσίες, π.χ. Merchant Center.</tspan></text>
</svg>
