<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596">
  <rect width="720" height="596" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <rect x="18" y="18" width="684" height="64" rx="14" fill="#edfaff" stroke="#0086ff" stroke-width="3"/>
  <text x="360" y="58" text-anchor="middle" font-size="24" fill="#0f172a">Το CSV κρατάει διευθύνσεις εικόνων, όχι εικόνες</text>
  <text x="183" y="134" text-anchor="middle" font-size="28" font-weight="700" fill="#b91c1c">Ανάποδη σειρά</text>
  <text x="537" y="134" text-anchor="middle" font-size="28" font-weight="700" fill="#15803d">Σωστή σειρά</text>
