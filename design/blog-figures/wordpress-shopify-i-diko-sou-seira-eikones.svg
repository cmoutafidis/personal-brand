  <text x="183" y="196" text-anchor="middle" font-size="24" fill="#0f172a">1. Εξάγω CSV</text>
  <line x1="183" y1="220" x2="183" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="18" y="252" width="330" height="96" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="3"/>
  <text x="183" y="308" text-anchor="middle" font-size="24" fill="#0f172a">2. Κλείνω το παλιό</text>
