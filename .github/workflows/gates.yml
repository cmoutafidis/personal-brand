name: gates

# The two checkers that read this repo, run on every push.
#
# WHY THIS EXISTS. Both replaced things that were nominally in place and were not working.
#
# The no-dash rule was enforced by `grep -n "—\|–" src/data/**/*.ts` pasted into CLAUDE.md. Bash
# leaves globstar off, so it matched one directory deep, 26 of the 28 files here. Worse, it could
# only ever have been noise: 19 of the dashes in this repo are somebody else's writing, quoted
# verbatim, and he decided on 2026-09-03 that they stay. A check reporting all 19 on every run is
# one that gets turned off.
#
# The hreflang parity check exists because until 2026-09-03 src/app/sitemap.ts built its own copy
# of the map, `{en, el}`, and stopped there: every page published three values and the sitemap
# published two, on all 34 route entries, with x-default the one missing. THAT DEFECT WAS ALREADY
# KNOWN AND WRITTEN DOWN, in charismoutafidis-com/src/app/sitemap.ts, which says of this site "its
# sitemap omits x-default while its pages emit one". Separate remote, so nothing here could go red
# on it, and it survived for as long as nobody happened to open that file. A finding recorded
# somewhere unreachable is a finding that does not exist.
#
# ⚠️ THE THIRD CHECKER WAS ADDED 2026-09-06 AND IT CLOSES A HOLE ALL OF THE ABOVE WERE BLIND TO.
# Charis banned publishing his `charis@` mailbox on 2026-09-06. The estate measured itself the same
# day: the address appeared ZERO times on 106 of 106 live routes and SEVENTEEN times in fourteen
# source files, nine of them `offer.guarantee.contact` values that `offer-build` renders onto a
# public page. Every gate in all three repos was green, and not one of them was buggy. They were
# green because no checker here had ever looked at an email address. The rule was written into
# `companies/*/voice.md`, which is a prompt-level guard rather than a gate.
#
#     WHEN A VALUE IS BANNED, GREP THE GENERATOR, NOT ONLY THE OUTPUT.
#
# TWO JOBS, AND THE ORDER MATTERS. `self-test` runs FIRST and proves each checker can still go red:
# both scripts sabotage their own internals and assert the fixtures notice. A neutered checker
# looks exactly like a clean repo on an ordinary push.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Prove the gates can go red
    runs-on: ubuntu-latest
    steps:
      # ⚠️ PINNED AT v7 ON 2026-09-10, UP FROM THE v4 MAJOR, IN ALL FIVE GTM REPOS IN ONE PASS.
      # Every run of this workflow carried GitHub's own deprecation annotation, naming the checkout
      # action at its old major as targeting Node.js 20 and being forced onto Node.js 24. All five
      # repos pinned that same major, so all five gate suites would have broken on the same day
      # support was withdrawn. That is the failure mode uniformity buys and also the one it
      # concentrates. STATE section 182 carries his answer of 2026-09-10: all five together.
      # v7 is the current major, read off the GitHub API on 2026-09-10 as v7.0.1 rather than recalled
      # from memory. The move to Node 24 itself landed in v5.0.0.
      # ⚠️ v7.0.0 blocks a fork PR checkout under `pull_request_target` and `workflow_run`. Neither
      # event appears in any workflow in any of the five repos, and none of the twelve checkout steps
      # carries a `with:` block, so nothing here can reach that change. The v5 and v6 minimum runner
      # versions are satisfied by `ubuntu-latest`.
      # ⛔ Do not bump one of these repos alone. STATE section 182, in its own words: "Bumping one
      # forks a pattern four documents describe as byte-identical."
      - uses: actions/checkout@v7
      - name: The checkers must exist
        run: |
          for f in scripts/no-shipped-dashes.py scripts/hreflang-parity.py scripts/hreflang-reciprocity.py scripts/no-published-private-contacts.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::GATE NEUTERED. $f is missing from the tree. This is not a"
              echo "runner problem. Restore the file or delete this workflow deliberately."
              exit 1
            fi
          done
      # ⚠️ The allowlist is load-bearing and its absence is silent: without it the dash gate reports
      # the three quoted spans that carry no guillemets in the source as defects, which is the
      # shape of noise that gets a check deleted.
      - name: The dash allowlist must exist
        run: |
          if [ ! -f scripts/dash-allowlist.txt ]; then
            echo "::error file=scripts/dash-allowlist.txt::The allowlist is gone. Three verbatim"
            echo "quotations here carry no guillemets in the source and are allowed by SHA-1."
            echo "Without this file they read as defects and the gate becomes noise."
            exit 1
          fi
      - run: python3 scripts/no-shipped-dashes.py --selftest
      - run: python3 scripts/hreflang-parity.py --selftest
      - run: python3 scripts/hreflang-reciprocity.py --selftest
      - run: python3 scripts/no-published-private-contacts.py --selftest

  gates:
    name: No shipped dashes, the sitemap matches the pages, every hreflang pair names back, no banned mailbox is published
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ⚠️ PINNED AT v7 ON 2026-09-10, UP FROM THE v4 MAJOR, IN ALL THREE REPOS THAT RUN NODE.
      # His answer to open decision 15, given the same day as decision 14 and on the same reasoning.
      # After the checkout bump earlier that day this was the ONLY action left targeting Node 20
      # anywhere in the estate, and it was exactly what the three surviving deprecation annotations
      # named. v7 is the current major, read off the GitHub API on 2026-09-10 as v7.0.0, published
      # 2026-07-14. The move to Node 24 itself landed in v5.0.0.
      # ⚠️ UNLIKE THE CHECKOUT STEP, THIS ONE CARRIES A `with:` BLOCK, so every change between v4 and
      # v7 was checked against these two inputs rather than waved through:
      #   v5.0.0 caches automatically when package.json carries a `packageManager` field. None of the
      #     three package.json files has one, and `cache: npm` is set explicitly here regardless.
      #   v6.0.0 narrowed that automatic caching to npm. Same answer.
      #   v6.1.0 removed `always-auth` handling, and v7.0.0 removed the dummy NODE_AUTH_TOKEN export.
      #     Neither string occurs in any workflow in any of the five repos, and no `registry-url` is
      #     set, so nothing here authenticates to a registry.
      #   `cache: npm` needs a lockfile to key on. All three repos carry package-lock.json.
      # ⛔ Do not bump one of these alone. STATE section 185.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠️ THE PARITY GATE READS .next, NOT src, and lowercases both sides. Next emits the React
      # prop name hrefLang in page HTML while the sitemap uses the lowercase attribute, so a
      # case-sensitive comparison reports a correct site as having no hreflang at all.
      - run: npm run build
      - run: python3 scripts/no-shipped-dashes.py
      - run: python3 scripts/hreflang-parity.py
      # ⚠️ RECIPROCITY IS NOT REDUNDANT WITH THE GATE ABOVE, and 2026-09-05 is the proof. THIS
      # site shipped a one-way hreflang set on /en/blog, a noindex page deliberately absent from
      # the sitemap, and THREE gates across two repos were green over it: hreflang-parity.py above
      # iterates the SITEMAP, so it never enumerated the page at all, and the sibling's gate only
      # ever reads the x-default target. The same defect was then found live in the SIBLING repo
      # the next day. hreflang-reciprocity.py iterates the BUILD and resolves every alternate,
      # which is the only way to see a route that is deliberately kept out of the sitemap.
      - run: python3 scripts/hreflang-reciprocity.py
      # ⚠️ THIS ONE MUST RUN AFTER THE BUILD. It reads .next/server/app and .next/static as well
      # as src, because the build is what a stranger reads and the source is what regenerates it.
      # It catches the literal address, six obfuscations of it, and the split-variable shape that
      # search.ch uses to publish an address a grep returns zero on.
      - run: python3 scripts/no-published-private-contacts.py
